<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Pal</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="app-container">
        <div id="sidepanel">
            <div id="sidepanel_home" class="sidepanelbtn">
                Home
            </div>
            <div id="sidepanel_mywork" class="sidepanelbtn">
                My Work
            </div>
            <div id="sidepanel_explore" class="sidepanelbtn">
                Explore
            </div>
            <div id="sidepanel_forum" class="sidepanelbtn">
                Forum
            </div>
            <div id="sidepanel_follow" class="sidepanelbtn">
                Follow
            </div>
            <div id="sidepanel_chat" class="sidepanelbtn">
                Chat
            </div>
            <div id="sidepanel_saves" class="sidepanelbtn">
                Saves
            </div>
            <div id="sidepanel_profile" class="sidepanelbtn">
                Profile
            </div>


            <div class="profilepreview-wrapper" id="profileBtn">
                <div class="profilepreview">
                    <img class="profilepic" src="favicon/profilepc.png">
                    <h4 class="username"></h4>
                </div>

                <div class="profile-dropdown" id="profileDropdown">
                    <button class="dropdown-item" id="loginBtn">Log In</button>
                    <button class="dropdown-item" id="signupBtn">Sign Up</button>
                </div>

                <div class="modal-overlay" id="signupModal">
                    <div class="modal-box">
                        <button class="modal-close" id="closeModal">&times;</button>
                        <h2 class="modal-logo">Study Pal</h2>
                        <h1 class="modal-title">Please select an option below</h1>

                        <button class="auth-btn google-btn">
                            <img src="favicon/auth-img.jpg" class="auth-icon">
                            Continue with Google
                        </button>

                        <div class="modal-divider"><span>OR</span></div>

                        <div class="placeholder-wrapper">
                            <input type="text" placeholder="Email or Username" class="signup-placeholder" id="username-placeholder">
                            <input type="password" placeholder="Password" class="signup-placeholder" id="password-placeholder">
                        </div>
                        <button class="modal-continue-btn" id="continueBtn">Continue</button> 
                    </div>
                </div>
            </div>
        </div>

        <div class="mainContent">
            <div class="searchbar">
                <input type="text" placeholder="Search..." class="search-input">
            </div>

            <div id="homeView" class="content-view">
                <h2 id="greetings"></h2>
            </div>
            

            <div id="profileView" class="content-view" style="display: none;">
                <div class="profileView-container">
                    <img src="favicon/profilepc.png" id="profilepicView">
                    <h1 class="username" style="color: white;">altaafihsan</h1>
                </div>
                <div class="horizontal-container">
                    <div id="post" class="profile-button"><h3>Post</h3></div>
                    <div id="studyplan" class="profile-button"><h3>Study Plan</h3></div>
                    <div id="friends" class="profile-button"><h3>Friends</h3></div>
                    
                </div>
            </div>

            <div id="myworkView" class="content-view" style="display: none;">
                
            </div>

            
            <div id="exploreView" class="content-view" style="display: none;">

            </div>

            
            <div id="forumView" class="content-view" style="display: none;">

            </div>

            
            <div id="followView" class="content-view" style="display: none;">

            </div>

            
            <div id="chatView" class="content-view" style="display: none;">

            </div>

            
            <div id="savesView" class="content-view" style="display: none;">

            </div>
        </div>

        <div class="rightpanel">
            <h3>Friends Activity</h3>
            <div class="friendsContainer">
                <div class="friendsProfile">
                    <img class="profilepic" src="favicon/profilepc.png">
                    <h4 class="friendusername"></h4>
                </div>
            </div>
            <h3>People you might study well with</h3>
            <div class="strangerContainer">
                <div class="strangerProfile">
                    <img class="profilepic" src="favicon/profilepc.png">
                    <h4 class="strangerusername"></h4>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
