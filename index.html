<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Pal</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>
<body>
    <div class="app-container">
        <div id="sidepanel">
            <div id="sidepanel_home" class="sidepanelbtn">
                Home
            </div>
            <div id="sidepanel_mywork" class="sidepanelbtn">
                My Work
            </div>
            <div id="sidepanel_explore" class="sidepanelbtn">
                Explore
            </div>
            <div id="sidepanel_forum" class="sidepanelbtn">
                Forum
            </div>
            <div id="sidepanel_follow" class="sidepanelbtn">
                Follow
            </div>
            <div id="sidepanel_chat" class="sidepanelbtn">
                Chat
            </div>
            <div id="sidepanel_saves" class="sidepanelbtn">
                Saves
            </div>
            <div id="sidepanel_profile" class="sidepanelbtn">
                Profile
            </div>

            <div class="profilepreview">
                <img class="profilepic" src="favicon/profilepc.png">
                <h4 class="username"></h4>
            </div>
        </div>

        <div class="mainContent">
            <div class="searchbar">
                <input type="text" placeholder="Search..." class="search-input">
            </div>
            
            <h2 id="greetings"></h2>
        </div>

        <div class="rightpanel">
            <h3>Friends Activity</h3>
            <div class="friendsContainer">
                <div class="friendsProfile">

                </div>
            </div>
            <h3>People you might study well with</h3>
        </div>
    </div>

</body>
</html>
